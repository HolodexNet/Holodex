name: Check PRs

on:
  pull_request

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: npm run build
