    <!--
      Restores the viewer's computed theme before first paint. The palette is
      derived from their primary colour by src/lib/theme and cached here on
      every change; without a cache the defaults in src/index.css apply.
    -->
    <script>
      try {
        var cached = JSON.parse(localStorage.getItem("holodex-v3/theme-cache"));
        if (cached && cached.vars) {
          var root = document.documentElement;
          root.classList.toggle("dark", cached.mode === "dark");
          root.style.colorScheme = cached.mode;
          for (var name in cached.vars) root.style.setProperty(name, cached.vars[name]);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", cached.background);
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>
      <strong>
        We're sorry but this site doesn't work properly without JavaScript enabled. Please enable it
        to continue.
      </strong>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
